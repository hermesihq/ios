name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The package's core is plain Foundation, so everything that does not need UIKit is tested on Linux.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  # The part that needs UIKit and UserNotifications can only be compiled by Apple's toolchain. `swift test` on the
  # macOS host covers the decisions the notification delegate makes; the iOS builds compile the delegate and
  # `requestAuthorization` themselves, for a device and for the simulator.
  apple:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift --version && xcodebuild -version
      - run: swift test
      - run: xcodebuild build -scheme HermesiPush -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
      - run: xcodebuild build -scheme HermesiPush -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

  # The sample app is generated by XcodeGen and has to keep compiling against the package it demonstrates. It cannot be
  # signed here, and does not need to be: this checks that it compiles for the simulator.
  example:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: Example
      - run: xcodebuild build -project HermesiPushExample.xcodeproj -scheme Example -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
        working-directory: Example
      # The token server the sample uses: the format of the subscriber token it mints.
      - run: node --test "Example/token-server/*.test.mjs"

